name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, os: windows-2022, flavor: cuda-opencl}
          - {target: linux-x64, os: ubuntu-22.04, flavor: cuda-opencl}
          - {target: macos-x64, os: macos-15-intel, flavor: opencl}
          - {target: macos-arm64, os: macos-14, flavor: opencl}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_version.py "$env:RELEASE_TAG"
        shell: pwsh
      - name: Install build and OpenCL dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install CUDA component wheels
        if: matrix.flavor == 'cuda-opencl'
        run: python -m pip install -r requirements-cuda.txt
      - name: CPU rule, lifecycle, library, backend, and BOINC tests
        run: python -m unittest test_validator test_library_cache test_lifecycle test_gpu_backends test_boinc_worker -v
      - name: Independent BOINC result validation tests
        run: python -m unittest discover -s boinc -p "test_*.py" -v
      - name: Build native archive and smoke-test frozen commands
        run: python scripts/build_release.py --flavor ${{ matrix.flavor }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
  linux-opencl:
    name: Linux source and frozen OpenCL diagnostics
    needs: native
    # Keep the native archive's Ubuntu 22.04 baseline. Its PoCL 1.8/LLVM 11
    # cannot identify newer CI CPUs; Ubuntu 24.04 supplies PoCL 5.0 instead.
    # https://packages.ubuntu.com/noble/pocl-opencl-icd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POCL_MAX_PTHREAD_COUNT: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install diagnostic dependencies and CPU OpenCL runtime
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pocl-opencl-icd
      - name: Source OpenCL correctness on PoCL (CPU diagnostic, not GPU certification)
        run: python test_gpu.py --backend opencl --allow-opencl-cpu --replicas 128 --output build/opencl-pocl-diagnostic.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-linux-x64
          path: native-artifact
      - name: Extract the actual Ubuntu 22.04 release archive
        run: |
          mkdir frozen
          tar -xzf native-artifact/EternityIISolver-*-linux-x64-cuda-opencl.tar.gz -C frozen
      - name: Record system OpenCL driver dependencies under the frozen library path
        run: |
          pocl_library="$(find /usr/lib/x86_64-linux-gnu -maxdepth 1 -name 'libpocl.so.2' -print -quit)"
          test -n "$pocl_library"
          mkdir -p build
          LD_LIBRARY_PATH="$PWD/frozen/EternityIISolver/_internal:${LD_LIBRARY_PATH:-}" ldd -r "$pocl_library" > build/opencl-driver-linkage.txt 2>&1
          cat build/opencl-driver-linkage.txt
      - name: Frozen OpenCL correctness on PoCL (CPU diagnostic, not GPU certification)
        run: |
          if LD_DEBUG=libs,versions ./frozen/EternityIISolver/EternityIISolver diagnose --backend opencl --allow-opencl-cpu --replicas 128 --output build/frozen-opencl-pocl.json 2> build/frozen-opencl-loader.log; then
            test -s build/frozen-opencl-pocl.json
          else
            tail -n 100 build/frozen-opencl-loader.log
            exit 1
          fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-linux-x64
          path: |
            build/opencl-pocl-diagnostic.json
            build/frozen-opencl-pocl.json
            build/opencl-driver-linkage.txt
            build/frozen-opencl-loader.log
          if-no-files-found: warn

  python-package:
    name: Python wheel and source archive
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m build
      - name: Check wheel contents and isolated resource loading
        shell: bash
        run: |
          python scripts/check_wheel.py dist/*.whl
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -c "from validator import load_bundle,validate_board; b=load_bundle(); r=validate_board(b.record_board,b); assert r['valid'] and r['score']==466; print('Installed wheel resource validation passed')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native, python-package, linux-opencl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Write aggregate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz *.whl > SHA256SUMS.txt
      - name: Create release from the pushed version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes --notes-file .github/RELEASE_NOTES.md
