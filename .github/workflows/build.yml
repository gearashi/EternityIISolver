name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, os: windows-2022, flavor: cuda-opencl}
          - {target: linux-x64, os: ubuntu-22.04, flavor: cuda-opencl}
          - {target: macos-x64, os: macos-15-intel, flavor: opencl}
          - {target: macos-arm64, os: macos-14, flavor: opencl}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_version.py "$env:RELEASE_TAG"
        shell: pwsh
      - name: Install build and OpenCL dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install CUDA component wheels
        if: matrix.flavor == 'cuda-opencl'
        run: python -m pip install -r requirements-cuda.txt
      - name: CPU rule, lifecycle, library, backend, and BOINC tests
        run: python -m unittest test_validator test_library_cache test_lifecycle test_gpu_backends test_boinc_worker -v
      - name: Independent BOINC result validation tests
        run: python -m unittest discover -s boinc -p "test_*.py" -v
      - name: Install diagnostic CPU OpenCL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pocl-opencl-icd
      - name: OpenCL kernel correctness on PoCL (CPU diagnostic, not GPU certification)
        if: runner.os == 'Linux'
        env:
          POCL_MAX_PTHREAD_COUNT: '2'
          OMP_NUM_THREADS: '2'
        run: python test_gpu.py --backend opencl --allow-opencl-cpu --replicas 128 --output build/opencl-pocl-diagnostic.json
      - name: Build native archive and smoke-test frozen commands
        run: python scripts/build_release.py --flavor ${{ matrix.flavor }}
      - name: Frozen OpenCL correctness on PoCL (CPU diagnostic, not GPU certification)
        if: runner.os == 'Linux'
        env:
          POCL_MAX_PTHREAD_COUNT: '2'
          OMP_NUM_THREADS: '2'
        run: ./dist/EternityIISolver/EternityIISolver diagnose --backend opencl --allow-opencl-cpu --replicas 128 --output build/frozen-opencl-pocl.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload diagnostic evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/opencl-pocl-diagnostic.json
            build/frozen-opencl-pocl.json
          if-no-files-found: warn

  python-package:
    name: Python wheel and source archive
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m build
      - name: Check wheel contents and isolated resource loading
        shell: bash
        run: |
          python scripts/check_wheel.py dist/*.whl
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -c "from validator import load_bundle,validate_board; b=load_bundle(); r=validate_board(b.record_board,b); assert r['valid'] and r['score']==466; print('Installed wheel resource validation passed')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native, python-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Write aggregate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz *.whl > SHA256SUMS.txt
      - name: Create release from the pushed version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes --notes-file .github/RELEASE_NOTES.md
