[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "eternity-ii-solver"
version = "0.5.7"
description = "Local GPU repair and exact constraint search for the five-clue Eternity II puzzle"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "DATA_PROVENANCE.md"]
keywords = ["eternity-ii", "edge-matching", "cuda", "opencl", "puzzle"]
dependencies = ["numpy>=2.0,<2.6", "pyopencl>=2024.3", "ortools>=9.15,<9.16", "python-sat>=1.9.dev15,<2"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux", "Operating System :: MacOS"]

[project.optional-dependencies]
cuda = [
  "cupy-cuda12x>=14.2,<15; sys_platform != 'darwin'",
  "nvidia-cuda-runtime-cu12==12.9.79; sys_platform != 'darwin'",
  "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform != 'darwin'",
]
build = ["build>=1.2,<2", "pyinstaller>=6.16,<7"]

[project.scripts]
eternity-solver = "launcher:main"

[project.urls]
Repository = "https://github.com/gearashi/EternityIISolver"
Issues = "https://github.com/gearashi/EternityIISolver/issues"

[tool.setuptools]
py-modules = ["launcher", "app_paths", "process_control", "dashboard_server", "solver", "gpu_engine", "gpu_backends", "kernel_port", "validator", "library_cache", "library_download", "archive_import", "test_gpu", "boinc_worker", "boinc_cpu_workunit", "manual_export", "exact_model", "exact_dfs", "dfs_profiles", "pivot_cut", "neighbor_cut", "neighbor_hall", "exact_sat", "exact_cp", "exact_worker", "search_resources", "exact_diagnostics", "hybrid_sampling", "exact_rules", "exact_optimize", "smart_repair", "exact_parallel", "mismatch_bounds", "exact_sat_optimize", "gpu_assignment", "binary_pairwise", "repair_diversify", "repair_parents", "repair_regions", "repair_policy", "repair_checkpoint", "repair_quality", "repair_guidance", "repair_exact_regions", "repair_multisource", "replica_exchange", "joint_inventory", "residual_components", "repair_bounds", "repair_certificates", "repair_reasoning", "relational_regions", "overlap_bounds", "explained_dfs", "explained_rules", "regional_master", "refined_diagrams", "impact_dfs", "repair_radius", "repair_triples", "repair_radius_cli", "repair_native_radius", "repair_transfer_bound", "perfect_distance", "perfect_distance_cli", "regional_dual", "repair_rotations", "repair_witnesses", "regional_sat_oracle", "regional_distance", "regional_distance_replay", "repair_patches", "repair_patches_cli", "repair_parent_learning", "repair_parent_pair_cli", "repair_components", "repair_component_family", "repair_signed_cover"]
packages = ["eternity_resources"]
include-package-data = true
